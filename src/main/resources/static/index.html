<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexlet Task Manager</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header class="page-header">
        <h1>Task Manager</h1>
        <div id="auth-status" class="auth-status"></div>
        <button id="logout-btn" class="button button--secondary hidden" type="button">Выйти</button>
    </header>

    <main class="page-content">
        <section class="panel" id="login-panel">
            <h2>Вход в систему</h2>
            <form id="login-form" class="form">
                <label>
                    Email
                    <input type="email" name="username" required>
                </label>
                <label>
                    Пароль
                    <input type="password" name="password" required>
                </label>
                <button class="button" type="submit">Войти</button>
            </form>
        </section>

        <section class="panel hidden" id="app-panel">
            <div class="panel__header">
                <h2>Пользователи</h2>
                <button id="refresh-btn" class="button button--secondary" type="button">Обновить</button>
            </div>

            <div id="message" class="message hidden"></div>

            <section class="panel__section">
                <h3>Регистрация нового пользователя</h3>
                <form id="create-form" class="form">
                    <div class="form__row">
                        <label>
                            Email
                            <input type="email" name="email" required>
                        </label>
                        <label>
                            Имя
                            <input type="text" name="firstName">
                        </label>
                        <label>
                            Фамилия
                            <input type="text" name="lastName">
                        </label>
                        <label>
                            Пароль
                            <input type="password" name="password" minlength="3" required>
                        </label>
                    </div>
                    <button class="button" type="submit">Создать</button>
                </form>
            </section>

            <section class="panel__section">
                <h3>Редактирование пользователя</h3>
                <form id="update-form" class="form">
                    <input type="hidden" name="id" id="update-id">
                    <div class="form__row">
                        <label>
                            Email
                            <input type="email" name="email" id="update-email">
                        </label>
                        <label>
                            Имя
                            <input type="text" name="firstName" id="update-firstName">
                        </label>
                        <label>
                            Фамилия
                            <input type="text" name="lastName" id="update-lastName">
                        </label>
                        <label>
                            Пароль
                            <input type="password" name="password" id="update-password" minlength="3">
                        </label>
                    </div>
                    <div class="form__actions">
                        <button class="button" type="submit">Сохранить изменения</button>
                        <button class="button button--secondary" id="reset-update" type="button">Очистить</button>
                    </div>
                </form>
            </section>

            <section class="panel__section">
                <h3>Список пользователей</h3>
                <div class="table-container">
                    <table id="users-table" class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Имя</th>
                                <th>Фамилия</th>
                                <th>Создан</th>
                                <th class="data-table__actions">Действия</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <footer class="page-footer">
        <p>Hexlet Task Manager &copy; 2025</p>
    </footer>

    <script src="assets/app.js" defer></script>
</body>
</html>
